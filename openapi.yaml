openapi: 3.1.0
info:
  title: Daraz Store Hub API
  version: 1.0.0
  description: Multi-tenant store management API. Store tokens are omitted from normal responses and can be revealed on demand by the owning user.
servers:
  - url: /api
security:
  - bearerAuth: []
paths:
  /auth/signup:
    post:
      security: []
      summary: Create a user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, maxLength: 100 }
                email: { type: string, format: email }
                password: { type: string, minLength: 12 }
      responses:
        "201": { description: Account created; access token returned and refresh cookie set }
        "400": { description: Invalid input }
        "409": { description: Email already registered }
  /auth/login:
    post:
      security: []
      summary: Sign in
      responses:
        "200": { description: Access token returned and HttpOnly refresh cookie set }
        "401": { description: Invalid credentials }
        "429": { description: Rate limit exceeded }
  /auth/refresh:
    post:
      security: []
      summary: Rotate the refresh cookie and issue an access token
      responses:
        "200": { description: Access token returned and refresh cookie rotated }
        "401": { description: Refresh session invalid or expired }
  /auth/logout:
    post:
      security: []
      summary: Revoke current refresh session
      responses:
        "204": { description: Session revoked }
  /auth/password:
    post:
      summary: Change password
      responses:
        "200": { description: Password changed; current refresh session rotated }
        "400": { description: Current password incorrect or new password invalid }
  /me:
    get:
      summary: Get current user profile
      responses:
        "200": { description: Current user }
  /dashboard:
    get:
      summary: Get current user's store status counts
      responses:
        "200": { description: Summary counts }
  /stores:
    get:
      summary: List current user's stores and expiry metadata
      responses:
        "200": { description: Store list; credentials omitted }
    post:
      summary: Add a store
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label, country]
              properties:
                label: { type: string, maxLength: 100 }
                country: { type: string, minLength: 2, maxLength: 2 }
      responses:
        "201": { description: Store created }
  /stores/{id}:
    get:
      summary: Get an owned store's seller details, token expiry metadata and recent activity
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Store details; credentials omitted }
        "404": { description: Store not found }
    delete:
      summary: Remove an owned store and its credentials
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Store removed }
        "404": { description: Store not found }
  /stores/{id}/tokens:
    get:
      summary: Reveal an owned store's access and refresh tokens on demand
      description: Owner-only, rate-limited response. Not cacheable; token values should be treated as secrets.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Plaintext tokens for the owned store
          headers:
            Cache-Control: { schema: { type: string }, example: "no-store, private" }
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, refreshToken]
                properties:
                  accessToken: { type: string }
                  refreshToken: { type: string }
        "404": { description: Store not found or not owned by the current user }
        "409": { description: Store has no Daraz tokens }
        "429": { description: Rate limit exceeded }
  /stores/{id}/profile:
    post:
      summary: Re-fetch the seller profile from Daraz (/seller/get) using the stored access token
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Updated store details }
        "409": { description: No valid access token; refresh or reconnect first }
        "502": { description: Daraz request failed }
  /stores/{id}/connect:
    post:
      summary: Create single-use OAuth state and return authorization URL
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Authorization URL }
        "404": { description: Store not found }
        "503": { description: Region integration not configured }
  /stores/{id}/refresh:
    post:
      summary: Request a new access token for an owned store
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Updated status only; token values are never returned }
        "409": { description: Refresh token expired or unavailable }
        "502": { description: Daraz request failed }
  /stores/{id}/order-sync-settings:
    patch:
      summary: Update an owned store's order sync start date and frequency
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromDate, frequency]
              properties:
                fromDate: { type: string, format: date }
                frequency: { type: string, enum: [manual, every_15_minutes, hourly, every_6_hours, daily] }
      responses:
        "200": { description: Updated sync settings }
        "400": { description: Invalid start date or frequency }
        "404": { description: Store not found }
  /stores/{id}/orders/sync:
    post:
      summary: Queue an order and product sync for an owned store
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "202": { description: Sync queued }
        "409": { description: Store is not connected or a sync is already running }
  /orders:
    get:
      summary: Search, filter, sort, and paginate orders owned by the current user
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: storeId, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
        - { name: orderStatus, in: query, schema: { type: string } }
        - { name: deliveryStatus, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: sortBy, in: query, schema: { type: string, enum: [customerName, orderId, createdAt, updatedAt, orderStatus, deliveryStatus, trackingNumber] } }
        - { name: sortOrder, in: query, schema: { type: string, enum: [asc, desc] } }
      responses:
        "200": { description: Paginated order rows with normalized customer, status, date, and tracking fields }
        "400": { description: Invalid query filters }
  /orders/{id}:
    get:
      summary: Get an owned order, including its full Daraz detail response
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Order fields and complete rawDetails JSON }
        "404": { description: Order not found }
  /products:
    get:
      summary: Search and paginate the current user's per-store product master
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: storeId, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        "200": { description: Paginated product master entries }
  /products/{id}:
    get:
      summary: Get an owned product with its full Daraz item detail response
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Product master fields and complete rawDetails JSON }
        "404": { description: Product not found }
  /oauth/daraz/callback:
    get:
      security: []
      summary: Daraz OAuth callback
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        "302": { description: Redirect to store dashboard }
        "400": { description: State invalid, expired, or already consumed }
  /admin/users:
    get:
      summary: Admin: list users
      responses:
        "200": { description: User list }
        "403": { description: Admin role required }
  /admin/users/{id}:
    patch:
      summary: Admin: activate/deactivate user or set temporary password
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: User updated }
        "403": { description: Admin role required }
  /admin/stores/{id}:
    get:
      summary: Admin: get any store's details, owner and recent activity (credentials excluded)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Store details }
        "404": { description: Store not found }
  /admin/stores:
    get:
      summary: Admin: list stores and token status (credentials excluded)
      responses:
        "200": { description: All stores }
  /admin/audit:
    get:
      summary: Admin: get latest audit events
      responses:
        "200": { description: Latest 250 audit events }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
